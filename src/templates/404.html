<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found | {{name}}</title>
    <base href="{{base_path}}">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; --bg:#000; --fg:#EDEDED; --muted:#8F8F8F; --accent:#86C5A2; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; text-align:center;
               background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
        h1 { font-size:clamp(4rem,14vw,8rem); margin:0; color:var(--accent); line-height:1; }
        p { color:var(--muted); margin:.75rem 0 1.5rem; }
        a { color:var(--accent); font-weight:600; border:2px solid currentColor; padding:.6rem 1.2rem; border-radius:999px; text-decoration:none; }
        a:hover, a:focus-visible { background:var(--accent); color:var(--bg); }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>This page doesn’t exist or has moved.</p>
        <a href="./">Back to portfolio</a>
    </main>
</body>
</html>
